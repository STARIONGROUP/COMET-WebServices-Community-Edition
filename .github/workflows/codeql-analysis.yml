name: "CodeQL Analysis"

on:
  # Feature branches are analysed through their pull request; analysing them on push as well runs everything twice
  push:
    branches:
      - development
      - master
  pull_request:
  schedule:
    - cron: '42 2 * * 3'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'csharp' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup .NET Core
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        dotnet-version: 10.0.x

    # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
      with:
        languages: ${{ matrix.language }}

    - name: add Starion GitHub nuget feed
      env:
        GH_PR_TOKEN: ${{ secrets.GH_PR_TOKEN }}
      run: dotnet nuget add source https://nuget.pkg.github.com/STARIONGROUP/index.json -n GHRHEA -u gh -p $GH_PR_TOKEN --store-password-in-clear-text

    - name: Install dependencies
      run: dotnet restore COMET-WebServices.sln

    - name: Build
      run: dotnet build COMET-WebServices.sln --no-restore

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
