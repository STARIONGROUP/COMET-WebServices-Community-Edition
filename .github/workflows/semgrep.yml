name: Semgrep OWASP Top Ten

on:
    # Feature branches are scanned through their pull request; scanning them on push as well runs everything twice
    push:
      branches:
        - development
        - master
    pull_request:
    schedule:
      - cron: '42 2 * * 3'

jobs:

  semgrep-full:
      runs-on: ubuntu-latest
      container:
        image: semgrep/semgrep

      steps:

        - name: clone application source code
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
          with:
            # We must fetch at least the immediate parents so that if this is
            # a pull request then we can checkout the head.
            fetch-depth: 2

        - name: full scan
          run: |
              semgrep scan --config "https://semgrep.dev/p/owasp-top-ten" --sarif --output=semgrep-sast.sarif --metrics=off

        - name: save report as pipeline artifact
          uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
          with:
            name: semgrep-sast.sarif
            path: semgrep-sast.sarif

        - name: publish code scanning alerts
          uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
          with:
            sarif_file: semgrep-sast.sarif
            category: semgrep